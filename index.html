        html, body {

            height: 100%;
            overflow: hidden;
            background: #0b0e14;
            touch-action: none;
            position: fixed;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #0b0e14;
            cursor: grab;
            touch-action: none;
        }
        canvas:active { cursor: grabbing; }
        .pointer { cursor: pointer !important; }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #8898a8;
            font: 14px monospace;
            pointer-events: none;
            text-shadow: 0 0 3px #000;
            z-index: 10;
        }
        #info-menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 30, 60, 0.85);
            border: 1px solid #00aaff;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.4);
            border-radius: 8px;
            padding: 15px;
            color: #cceeff;
            font-family: 'Courier New', monospace;
            display: none;
            z-index: 20;
            width: 90%;
            max-width: 320px;
            text-align: center;
        }
        #info-menu button {
            background: #0066aa;
            color: #ffffff;
            border: 1px solid #00ccff;
            border-radius: 4px;
            padding: 5px 15px;
            cursor: pointer;
            margin-bottom: 10px;
            font-family: inherit;
        }
        #info-menu .description {
            font-size: 14px;
            line-height: 1.4;
        }

</head>

            H = window.innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + 'px';
            canvas.style.height = H + 'px';
        }

            const scaleFactor = CONFIG.sunRadius; // Масштаб для перевода в мировые единицы / Scale to world units
            for (let i = 0; i < count; i++) {
                const r = (innerRadius + Math.random() * (outerRadius - innerRadius)) * scaleFactor;
                const theta0 = Math.random() * 2 * Math.PI;
                asteroids.push({
                    r: r,            // Радиус от Солнца / Distance from Sun
                    theta0: theta0    // Начальный угол / Initial angle
                });
            }
        }
        generateAsteroidBelt();

        // ============================================================
        // 4. ОРБИТАЛЬНАЯ МЕХАНИКА / ORBITAL MECHANICS
        // ============================================================
        // Вычисление позиции тела относительно его центра (Солнца или родителя) / Calculate local position relative to its center (Sun or parent)
        function getLocalOrbitPos(body, tDays) {
            const a = body.aWorld !== undefined ? body.aWorld : (body.a * CONFIG.sunRadius); // Большая полуось / Semi-major axis
            const e = body.e;
            const peri = body.peri || 0;
            const n = 2 * Math.PI / body.periodDays; // Средняя угловая скорость / Mean angular velocity
            const M = body.angle + n * tDays;        // Средняя аномалия / Mean anomaly

            // Решение уравнения Кеплера методом Ньютона / Solve Kepler's equation via Newton's method
            let E = M;
            for (let i = 0; i < 10; i++) {
                const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
                E -= dE;
                if (Math.abs(dE) < 1e-8) break;
            }
            const cosV = (Math.cos(E) - e) / (1 - e * Math.cos(E));
            const sinV = (Math.sqrt(1 - e*e) * Math.sin(E)) / (1 - e * Math.cos(E));
            const V = Math.atan2(sinV, cosV); // Истинная аномалия / True anomaly
            const r = a * (1 - e * Math.cos(E)); // Радиус / Radius
            const x0 = r * Math.cos(V);
            const y0 = r * Math.sin(V);
            const cosPeri = Math.cos(peri);
            const sinPeri = Math.sin(peri);
            return {
                x: x0 * cosPeri - y0 * sinPeri,
                y: x0 * sinPeri + y0 * cosPeri
            };
        }

        // Установка ссылок на родителей / Set parent references
        function setParents(arr, parent = null) {
            for (const body of arr) {
                body.parent = parent;
                if (body.satellites) setParents(body.satellites, body);
            }
        }
        setParents(CONFIG.planetData);

        // Получение мировой позиции тела / Get world position
        function getWorldPos(body, tDays) {
            if (!body.parent) return getLocalOrbitPos(body, tDays);
            const parentPos = getWorldPos(body.parent, tDays);
            const local = getLocalOrbitPos(body, tDays);
            return {
                x: parentPos.x + local.x,
                y: parentPos.y + local.y
            };
        }

        // Получение мировой позиции по имени / Get world position by name
        function getWorldPosByName(name, tDays) {
            function findInArray(arr) {
                for (const body of arr) {
                    if (body.name === name) return body;
                    if (body.satellites) {
                        const found = findInArray(body.satellites);
                        if (found) return found;
                    }
                }
                return null;
            }
            const target = findInArray(CONFIG.planetData);
            if (!target) return null;
            return getWorldPos(target, tDays);
        }

        // ============================================================
        // 5. МОДУЛЬ СЛЕЖЕНИЯ / FOLLOW MODULE
        // ============================================================
        // Запустить слежение за объектом / Start following an object
        function startFollow(planetName) {
            followTarget = planetName;
            followActive = true;
            followSmooth = true;
            const pos = getWorldPosByName(planetName, simTimeDays);
            if (pos) {
                smoothTargetX = -pos.x * scale;
                smoothTargetY = -pos.y * scale;
                smoothOffsetX = offsetX;
                smoothOffsetY = offsetY;
            }
        }

        // Остановить слежение / Stop following
        function stopFollow() {
            followActive = false;
            followTarget = null;
            followSmooth = false;
        }

        // Обновление слежения / Update follow
        function updateFollow() {
            if (!followActive || !followTarget) return;
            const pos = getWorldPosByName(followTarget, simTimeDays);
            if (!pos) return;
            const targetX = -pos.x * scale;
            const targetY = -pos.y * scale;

            if (followSmooth) {
                smoothOffsetX += (targetX - smoothOffsetX) * CONFIG.followSpeed;
                smoothOffsetY += (targetY - smoothOffsetY) * CONFIG.followSpeed;
                offsetX = smoothOffsetX;
                offsetY = smoothOffsetY;
                if (Math.abs(smoothOffsetX - targetX) < 0.5 && Math.abs(smoothOffsetY - targetY) < 0.5) {
                    followSmooth = false;
                    offsetX = targetX;
                    offsetY = targetY;
                }
            } else {
                offsetX = targetX;
                offsetY = targetY;
            }
        }

        // ============================================================
        // 6. ОТРИСОВКА / RENDERING
        // ============================================================
        // Перевод мировых координат в экранные / Convert world coordinates to screen coordinates
        function screenPos(worldX, worldY) {
            return {
                x: worldX * scale + W/2 + offsetX,
                y: worldY * scale + H/2 + offsetY
            };
        }

        // Форматирование даты / Format date
        function formatDate(d) {
            const y = d.getUTCFullYear();
            const m = String(d.getUTCMonth() + 1).padStart(2, '0');
            const day = String(d.getUTCDate()).padStart(2, '0');
            const h = String(d.getUTCHours()).padStart(2, '0');
            const min = String(d.getUTCMinutes()).padStart(2, '0');
            const s = String(d.getUTCSeconds()).padStart(2, '0');
            return `${y}.${m}.${day} ${h}:${min}:${s}`;
        }

        // Обновление HUD (таймер и скорость) / Update HUD (timer and speed)
        function updateHUD() {
            const currentDate = new Date(startDate.getTime() + simTimeDays * 86400 * 1000);
            hud.textContent = `${formatDate(currentDate)} | Скорость: ${timeScale}x`;
        }

        // Отрисовка орбиты / Draw orbit
        function drawOrbit(body, parentWorldPos) {
            const a = body.aWorld !== undefined ? body.aWorld : (body.a * CONFIG.sunRadius);
            const e = body.e;
            const peri = body.peri || 0;
            ctx.beginPath();
            const steps = 200;
            for (let i = 0; i <= steps; i++) {
                const M = (i / steps) * 2 * Math.PI;
                let E = M;
                for (let j = 0; j < 10; j++) {
                    const dE = (E - e * Math.sin(E) - M) / (1 - e * Math.cos(E));
                    E -= dE;
                    if (Math.abs(dE) < 1e-8) break;
                }
                const r = a * (1 - e * Math.cos(E));
                const cosV = (Math.cos(E) - e) / (1 - e * Math.cos(E));
                const sinV = (Math.sqrt(1 - e*e) * Math.sin(E)) / (1 - e * Math.cos(E));
                const V = Math.atan2(sinV, cosV);
                const x0 = r * Math.cos(V);
                const y0 = r * Math.sin(V);
                const cosPeri = Math.cos(peri);
                const sinPeri = Math.sin(peri);
                const x = x0 * cosPeri - y0 * sinPeri;
                const y = x0 * sinPeri + y0 * cosPeri;
                const worldX = parentWorldPos.x + x;
                const worldY = parentWorldPos.y + y;
                const screen = screenPos(worldX, worldY);
                if (i === 0) ctx.moveTo(screen.x, screen.y);
                else ctx.lineTo(screen.x, screen.y);
            }
            ctx.strokeStyle = CONFIG.orbitColor;
            ctx.lineWidth = 1;
            ctx.stroke();
        }

        // Отрисовка свечения вокруг объекта / Draw glow around object
        function drawGlow(screenX, screenY, color) {
            const glowRadius = Math.min(CONFIG.maxGlowPx, CONFIG.minGlowPx / scale);
            if (glowRadius <= 0) return;
            const gradient = ctx.createRadialGradient(screenX, screenY, 0, screenX, screenY, glowRadius);
            gradient.addColorStop(0, color + 'cc');
            gradient.addColorStop(1, color + '00');
            ctx.beginPath();
            ctx.arc(screenX, screenY, glowRadius, 0, Math.PI * 2);
            ctx.fillStyle = gradient;
            ctx.fill();
        }

        // Рекурсивная отрисовка тела и его спутников / Recursively draw body and its satellites
        function drawBody(body, parentWorldPos) {
            if (body.showOrbit !== false) { // Проверка флага showOrbit / Check showOrbit flag
                drawOrbit(body, parentWorldPos);
            }
            const localPos = getLocalOrbitPos(body, simTimeDays);
            const worldPos = {
                x: parentWorldPos.x + localPos.x,
                y: parentWorldPos.y + localPos.y
            };
            const screen = screenPos(worldPos.x, worldPos.y);
            const radius = body.radius * scale;

            drawGlow(screen.x, screen.y, body.color);

            // Отрисовка кольца, если есть / Draw ring if exists
            if (body.ring) {
                const innerR = radius * body.ring.innerFactor;
                const outerR = radius * body.ring.outerFactor;
                ctx.beginPath();
                ctx.arc(screen.x, screen.y, outerR, 0, Math.PI * 2);
                ctx.arc(screen.x, screen.y, innerR, 0, Math.PI * 2, true);
                ctx.closePath();
                const alphaHex = Math.floor(body.ring.alpha * 255).toString(16).padStart(2, '0');
                ctx.fillStyle = body.ring.color + alphaHex;
                ctx.fill();
            }

            // Отрисовка самой планеты / Draw planet itself
            ctx.beginPath();
            ctx.arc(screen.x, screen.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = body.color;
            ctx.fill();
            ctx.shadowColor = body.color;
            ctx.shadowBlur = Math.min(10, radius * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Определение, рисовать ли подпись / Decide whether to draw label
            let drawLabel = true;
            if (body.parent) {
                const parentScreen = screenPos(parentWorldPos.x, parentWorldPos.y);
                const dist = Math.hypot(screen.x - parentScreen.x, screen.y - parentScreen.y);
                if (dist < CONFIG.labelThreshold) {
                    drawLabel = false;
                }
            }
            if (drawLabel) {
                ctx.fillStyle = CONFIG.labelColor;
                ctx.font = '12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(body.nameRu, screen.x, screen.y - radius - 10);
            }

            // Сохранение экранных координат для обработки кликов / Save screen coords for click handling
            body._screenX = screen.x;
            body._screenY = screen.y;
            body._radius = radius;

            // Рекурсивно рисуем спутники / Recursively draw satellites
            if (body.satellites) {
                for (const sat of body.satellites) {
                    drawBody(sat, worldPos);
                }
            }
        }

        // Главная функция отрисовки / Main draw function
        function draw() {
            ctx.fillStyle = CONFIG.bgColor;
            const dpr = window.devicePixelRatio || 1;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.fillRect(0, 0, W, H);

            // Отрисовка Солнца / Draw Sun
            const sunScreen = screenPos(0, 0);
            const sunRadius = CONFIG.sunRadius * scale;
            ctx.beginPath();
            ctx.arc(sunScreen.x, sunScreen.y, sunRadius, 0, Math.PI * 2);
            ctx.fillStyle = CONFIG.sunColor;
            ctx.shadowColor = CONFIG.sunColor;
            ctx.shadowBlur = 50;
            ctx.fill();
            ctx.shadowBlur = 0;

            // Отрисовка планет / Draw planets
            for (const body of CONFIG.planetData) {
                drawBody(body, { x: 0, y: 0 });
            }

            // Отрисовка пояса астероидов (вращается) / Draw rotating asteroid belt
            if (CONFIG.asteroidBelt.enabled) {
                ctx.fillStyle = CONFIG.asteroidBelt.color;
                const periodDays = CONFIG.asteroidBelt.periodDays || 1500;
                const omega = 2 * Math.PI / periodDays;
                for (const ast of asteroids) {
                    const theta = ast.theta0 + omega * simTimeDays;
                    const x = ast.r * Math.cos(theta);
                    const y = ast.r * Math.sin(theta);
                    const screen = screenPos(x, y);
                    ctx.fillRect(screen.x, screen.y, 1, 1);
                }
            }
        }

        // ============================================================
        // 7. ЗУМ / ZOOM
        // ============================================================
        // Функция масштабирования к точке / Zoom to point
        function zoomAtPoint(factor, px, py) {
            const oldScale = scale;
            const newScale = Math.max(CONFIG.minScale, Math.min(CONFIG.maxScale, scale * factor));

            let zoomPointX = px;
            let zoomPointY = py;
            if (followActive && followTarget) {
                const pos = getWorldPosByName(followTarget, simTimeDays);
                if (pos) {
                    zoomPointX = pos.x * oldScale + W/2 + offsetX;
                    zoomPointY = pos.y * oldScale + H/2 + offsetY;
                }
            }

            const worldX = (zoomPointX - W/2 - offsetX) / oldScale;
            const worldY = (zoomPointY - H/2 - offsetY) / oldScale;

            offsetX = zoomPointX - W/2 - worldX * newScale;
            offsetY = zoomPointY - H/2 - worldY * newScale;
            scale = newScale;

            if (followActive && followTarget) {
                const pos = getWorldPosByName(followTarget, simTimeDays);
                if (pos) {
                    const targetX = -pos.x * scale;
                    const targetY = -pos.y * scale;
                    smoothTargetX = targetX;
                    smoothTargetY = targetY;
                    smoothOffsetX = offsetX;
                    smoothOffsetY = offsetY;
                    followSmooth = false;
                }
            }
        }

        // ============================================================
        // 8. УПРАВЛЕНИЕ МЫШЬЮ / MOUSE CONTROLS
        // ============================================================
        // Наведение курсора / Mouse hover
        canvas.addEventListener('mousemove', (e) => {
            if (dragging) {
                if (followActive) stopFollow();
                const dx = e.clientX - dragStartX;
                const dy = e.clientY - dragStartY;
                offsetX += dx;
                offsetY += dy;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                return;
            }
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            let found = false;
            function checkHover(arr) {
                for (const p of arr) {
                    if (p._screenX === undefined) continue;
                    const dx = mx - p._screenX;
                    const dy = my - p._screenY;
                    const hitRadius = Math.max(p._radius + 5, 15);
                    if (dx*dx + dy*dy < hitRadius * hitRadius) {
                        canvas.classList.add('pointer');
                        found = true;
                        return true;
                    }
                    if (p.satellites) {
                        if (checkHover(p.satellites)) return true;
                    }
                }
                return false;
            }
            if (!checkHover(CONFIG.planetData)) canvas.classList.remove('pointer');
        });

        // Нажатие кнопки мыши / Mouse down
        canvas.addEventListener('mousedown', (e) => {
            if (e.button === 0) {
                dragging = true;
                dragStartX = e.clientX;
                dragStartY = e.clientY;
                if (followActive) stopFollow();
            }
        });
        window.addEventListener('mouseup', () => { dragging = false; });

        // Колесо мыши / Mouse wheel
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const delta = e.deltaY || e.deltaX;
            const scaleStep = Math.abs(delta) < 50 ? 0.05 : 0.25;
            const factor = delta < 0 ? 1 + scaleStep : 1 - scaleStep;
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;
            zoomAtPoint(factor, px, py);
        }, { passive: false });

        // Клик мышью / Mouse click
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
            let clickedAny = false;
            function handleBodyClick(arr) {
                for (const p of arr) {
                    if (p._screenX === undefined) continue;
                    const dx = mx - p._screenX;
                    const dy = my - p._screenY;
                    const hitRadius = Math.max(p._radius + 5, 15);
                    if (dx*dx + dy*dy < hitRadius * hitRadius) {
                        clickedAny = true;
                        if (menuExcluded.includes(p.name)) {
                            // Для исключённых объектов включаем слежение / For excluded objects enable follow
                            if (followActive && followTarget === p.name) {
                                stopFollow();
                            } else {
                                startFollow(p.name);
                            }
                        } else {
                            // Открываем меню и сразу включаем слежение / Open menu and start follow
                            showMenu(p);
                            if (!followActive || followTarget !== p.name) {
                                startFollow(p.name);
                            }
                        }
                        return true;
                    }
                    if (p.satellites) {
                        if (handleBodyClick(p.satellites)) return true;
                    }
                }
                return false;
            }
            if (!handleBodyClick(CONFIG.planetData)) {
                // Клик по пустому месту / Click on empty space
                hideMenu();
                if (followActive) {
                    stopFollow();
                }
            }
        });

        // ============================================================
        // 9. СЕНСОРНОЕ УПРАВЛЕНИЕ / TOUCH CONTROLS
        // ============================================================
        let lastTouchX = 0, lastTouchY = 0;
        let lastPinchDist = 0;
        let lastPinchMidX = 0, lastPinchMidY = 0;
        let isTouching = false;
        let touchesCount = 0;
        let touchStartX = 0, touchStartY = 0;

        // Обработка начала касания / Touch start
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touches = e.touches;
            touchesCount = touches.length;
            if (touchesCount === 1) {
                const t = touches[0];
                lastTouchX = t.clientX;
                lastTouchY = t.clientY;
                touchStartX = t.clientX;
                touchStartY = t.clientY;
                dragStartX = t.clientX;
                dragStartY = t.clientY;
                isTouching = true;
                dragging = false;
                if (followActive) stopFollow();
                lastPinchDist = 0;
                lastPinchMidX = 0;
                lastPinchMidY = 0;
            } else if (touchesCount === 2) {
                const t1 = touches[0];
                const t2 = touches[1];
                const dx = t1.clientX - t2.clientX;
                const dy = t1.clientY - t2.clientY;
                lastPinchDist = Math.sqrt(dx*dx + dy*dy);
                lastPinchMidX = (t1.clientX + t2.clientX) / 2;
                lastPinchMidY = (t1.clientY + t2.clientY) / 2;
                isTouching = true;
                dragging = false;
            }
        }, { passive: false });

        // Движение пальцев / Touch move
        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touches = e.touches;
            const count = touches.length;
            if (count === 1) {
                const t = touches[0];
                if (lastPinchDist > 0) {
                    lastTouchX = t.clientX;
                    lastTouchY = t.clientY;
                    lastPinchDist = 0;
                }
                const dx = t.clientX - lastTouchX;
                const dy = t.clientY - lastTouchY;
                if (Math.abs(dx) > 2 || Math.abs(dy) > 2) {
                    dragging = true;
                    offsetX += dx;
                    offsetY += dy;
                }
                lastTouchX = t.clientX;
                lastTouchY = t.clientY;
                lastPinchDist = 0;
            } else if (count === 2) {
                const t1 = touches[0];
                const t2 = touches[1];
                const dx = t1.clientX - t2.clientX;
                const dy = t1.clientY - t2.clientY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const midX = (t1.clientX + t2.clientX) / 2;
                const midY = (t1.clientY + t2.clientY) / 2;

                if (lastPinchDist > 0) {
                    // 1) Панорамирование: сдвигаем камеру на смещение центра
                    const deltaX = midX - lastPinchMidX;
                    const deltaY = midY - lastPinchMidY;
                    offsetX += deltaX;
                    offsetY += deltaY;

                    // 2) Масштабирование вокруг нового центра
                    const factor = dist / lastPinchDist; // без ограничений для плавности
                    zoomAtPoint(factor, midX, midY);
                }

                // Обновляем сохранённые значения
                lastPinchDist = dist;
                lastPinchMidX = midX;
                lastPinchMidY = midY;
                dragging = false;
            }
        }, { passive: false });

        // Окончание касания / Touch end
                canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            const remainingTouches = e.touches;

            if (remainingTouches.length === 0) {
                // Полное отпускание всех пальцев
                if (isTouching && touchesCount === 1) {
                    const dist = Math.hypot(touchStartX - lastTouchX, touchStartY - lastTouchY);
                    if (dist < 10) {
                        const rect = canvas.getBoundingClientRect();
                        const mx = touchStartX - rect.left;
                        const my = touchStartY - rect.top;
                        function handleTap(arr) {
                            for (const p of arr) {
                                if (p._screenX === undefined) continue;
                                const dx = mx - p._screenX;
                                const dy = my - p._screenY;
                                const hitRadius = Math.max(p._radius + 5, 20);
                                if (dx*dx + dy*dy < hitRadius * hitRadius) {
                                    if (menuExcluded.includes(p.name)) {
                                        if (followActive && followTarget === p.name) {
                                            stopFollow();
                                        } else {
                                            startFollow(p.name);
                                        }
                                    } else {
                                        showMenu(p);
                                        if (!followActive || followTarget !== p.name) {
                                            startFollow(p.name);
                                        }
                                    }
                                    return true;
                                }
                                if (p.satellites) {
                                    if (handleTap(p.satellites)) return true;
                                }
                            }
                            return false;
                        }
                        if (!handleTap(CONFIG.planetData)) {
                            hideMenu();
                            if (followActive) stopFollow();
                        }
                    }
                }
                isTouching = false;
                dragging = false;
                lastPinchDist = 0;
                touchesCount = 0;
            } else if (remainingTouches.length === 1) {
                // Остался один палец – переключаемся в режим панорамирования
                const t = remainingTouches[0];
                lastTouchX = t.clientX;
                lastTouchY = t.clientY;
                touchStartX = t.clientX;
                touchStartY = t.clientY;
                dragStartX = t.clientX;
                dragStartY = t.clientY;
                isTouching = true;
                dragging = false;
                touchesCount = 1;
                lastPinchDist = 0;
                lastPinchMidX = 0;
                lastPinchMidY = 0;
            }
        }, { passive: false });

        // ============================================================
        // 10. УПРАВЛЕНИЕ СКОРОСТЬЮ ВРЕМЕНИ (отключено) / TIME SCALE CONTROLS (disabled)
        // ============================================================
        /*
        window.addEventListener('keydown', (e) => {
            if (e.key === '+' || e.key === '=') {
                e.preventDefault();
                if (timeScaleIndex < CONFIG.timeScales.length - 1) {
                    timeScaleIndex++;
                    timeScale = CONFIG.timeScales[timeScaleIndex];
                    console.log(`Скорость времени: ${timeScale}x`);
                }
            } else if (e.key === '-' || e.key === '_') {
                e.preventDefault();
                if (timeScaleIndex > 0) {
                    timeScaleIndex--;
                    timeScale = CONFIG.timeScales[timeScaleIndex];
                    console.log(`Скорость времени: ${timeScale}x`);
                }
            }
        });

        // ============================================================
        // 11. ГЛАВНЫЙ ЦИКЛ / MAIN LOOP
        // ============================================================
        function animate(timestamp) {
            if (!lastTimestamp) lastTimestamp = timestamp;
            const deltaMs = timestamp - lastTimestamp;
            lastTimestamp = timestamp;

            const deltaSeconds = deltaMs / 1000;
            simTimeDays += (deltaSeconds * timeScale) / 86400; // Обновление игрового времени / Update simulation time

            if (serverTargetTime !== null) {
                // Плавно подтягиваем локальное время к серверному
                const diff = serverTargetTime - simTimeDays;
                simTimeDays += diff * 0.1; // коэффициент сглаживания (можно подобрать)
                if (Math.abs(diff) < 0.0001) {
                    simTimeDays = serverTargetTime;
                    serverTargetTime = null;
                }
            }

            if (followActive) updateFollow();
            draw();
            updateHUD();

            requestAnimationFrame(animate);
        }


        async function syncTimeWithServer() {
            try {
                const response = await fetch(`${SERVER_URL}/time`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                if (typeof data.simTimeDays === 'number') {
                    simTimeDays = data.simTimeDays;
                }
                if (typeof data.timeScale === 'number') {
                    timeScale = data.timeScale;
                    // Обновляем HUD скорость
                    updateHUD();
                }
            } catch (err) {
                console.warn('Ошибка синхронизации времени с сервером:', err);
                // Можно продолжать использовать локальное время (если оно было)
            }
        }

        // Запускаем синхронизацию при старте
        async function syncTimeWithServer() {
            try {
                const response = await fetch(`${SERVER_URL}/time`);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                if (typeof data.simTimeDays === 'number') {
                    serverTargetTime = data.simTimeDays; // запоминаем цель
                }
                if (typeof data.timeScale === 'number') {
                    timeScale = data.timeScale;
                    updateHUD();
                }
            } catch (err) {
                console.warn('Ошибка синхронизации времени с сервером:', err);
            }
        }

        // Обновляемся каждые 2 секунды
        setInterval(syncTimeWithServer, 20000);


        // ============================================================
        // 12. СОХРАНЕНИЕ И ВОССТАНОВЛЕНИЕ СОСТОЯНИЯ / SAVE & RESTORE STATE
        // ============================================================
        // Сохранение состояния в localStorage / Save state to localStorage
        function saveState() {
            try {
                const state = {
                    simTimeDays: simTimeDays,
                    scale: scale,
                    offsetX: offsetX,
                    offsetY: offsetY,
                    timeScaleIndex: timeScaleIndex,
                    followTarget: followActive ? followTarget : null,
                    followActive: followActive
                };
                localStorage.setItem('expanse_map_state', JSON.stringify(state));
            } catch (e) {
                // localStorage может быть недоступен / localStorage might be unavailable
            }
        }

        // Загрузка состояния из localStorage / Load state from localStorage
        function loadState() {
            try {
                const saved = localStorage.getItem('expanse_map_state');
                if (!saved) return;
                const state = JSON.parse(saved);
                if (typeof state.simTimeDays === 'number') simTimeDays = state.simTimeDays;
                if (typeof state.scale === 'number') scale = state.scale;
                if (typeof state.offsetX === 'number') offsetX = state.offsetX;
                if (typeof state.offsetY === 'number') offsetY = state.offsetY;
                if (typeof state.timeScaleIndex === 'number' && state.timeScaleIndex >= 0 && state.timeScaleIndex < CONFIG.timeScales.length) {
                    timeScaleIndex = state.timeScaleIndex;
                    timeScale = CONFIG.timeScales[timeScaleIndex];
                }
                if (state.followActive && state.followTarget) {
                    startFollow(state.followTarget);
                    followSmooth = false; // Жёстко переходим к цели / Hard jump to target
                    updateFollow();
                }
            } catch (e) {
                // Ошибка восстановления / Restore error
            }
        }

        // Вызываем восстановление при старте / Call restore on startup
        loadState();

        // Сохраняем состояние каждые 3 секунды / Save every 3 seconds
        setInterval(saveState, 3000);

        // Сохраняем при закрытии страницы / Save on page close
        window.addEventListener('beforeunload', saveState);

        // Запуск анимации / Start animation
        requestAnimationFrame(animate);
    </script>
</body>
